function pill(v){return `<span class="pill ${v==='满足'||v==='合格'?'ok':v==='不满足'||v==='不合格'?'bad':'warn'}">${v}</span>`}
function render(a,data){

  const normalized=JSON.stringify(data,null,2).replace(/</g,'&lt;');

  h='<details class="section"><summary><b>零、自然语言转换后的标准 JSON</b></summary><pre style="white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12px;max-height:300px;overflow:auto">'+normalized+'</pre></details>'+h;
  if(rec){const diff=rec.total-lowest.total; h+=`<div class="callout"><b>推荐：${rec.供应商}</b>（风险调整评分 ${rec.scores.total.toFixed(2)} 分）。${rec.供应商===lowest.供应商?'同时为最低合格总成本方案。':`最低合格报价为 ${lowest.供应商}（${money(lowest.total)}），${rec.供应商} 高 ${money(diff)}；选择 ${rec.供应商} 的主要原因是付款条件和整体履约风险更优。`}</div>`} else h+=`<div class="callout"><b>暂无可直接推荐方案。</b>所有供应商均不合格或关键字段待确认。</div>`;
  h+=`<div class="section"><h2>一、统一口径成本对比</h2><div class="table-wrap"><table><thead><tr><th>供应商</th><th>设备小计</th><th>运费</th><th>安装调试</th><th>强制服务费</th><th>其他已知费用</th><th>含税总成本</th><th>成本排名</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.供应商}</td><td>${money(x.equipment)}</td><td>${typeof x.运费==='number'?money(x.freight):x.运费||'未提供'}</td><td>${typeof x.安装调试==='number'?money(x.install):x.安装调试||'未提供'}</td><td>${money(x.service)}</td><td>${money(x.other)}</td><td><b>${money(x.total)}</b></td><td>${x.costRank}</td></tr>`).join('')}</tbody></table></div></div>`;
  h+=`<div class="section"><h2>二、硬性要求校验</h2><div class="table-wrap"><table><thead><tr><th>供应商</th><th>数量</th><th>分辨率</th><th>有线网络</th><th>交付并安装</th><th>保修</th><th>安装调试</th><th>培训</th><th>资格结论</th><th>具体问题</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.供应商}</td>${Object.values(x.checks).map(y=>`<td>${pill(y)}</td>`).join('')}<td>${pill(x.qualification)}</td><td>${x.reasons.join('；')||'—'}</td></tr>`).join('')}</tbody></table></div></div>`;
  h+=`<div class="section"><h2>三、商务、交付与评分</h2><div class="table-wrap"><table><thead><tr><th>供应商</th><th>交付</th><th>付款方式</th><th>付款评分</th><th>交付评分</th><th>总评分</th><th>判断</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.供应商}</td><td>${x.交付工作日} 个工作日${x.交付含安装?'，含安装':'，安装范围待确认'}</td><td>${x.付款方式||'未提供'}</td><td>${x.scores?x.scores.pay:'—'}</td><td>${x.scores?x.scores.delivery:'—'}</td><td><b>${x.scores?x.scores.total.toFixed(2):'—'}</b></td><td>${x.qualification==='不合格'?'<span class="bad">不进入推荐</span>':x.scores&&x===rec?'<span class="ok">推荐</span>':x.qualification}</td></tr>`).join('')}</tbody></table></div></div>`;
  h+=`<div class="section"><h2>四、风险、整改建议与无法判断原因</h2>`;
  rows.forEach(x=>{const risks=[]; if(x.qualification==='不合格')risks.push(['high',`触发硬性规则：${x.reasons.join('；')}`,'不得推荐，采购需剔除或要求供应商重新报价/补充符合性证明。']); if(x.付款类型==='部分预付')risks.push(['','50% 预付，偏离验收后付款偏好','增加采购方资金占用与未验收先付款风险；建议改为验收后付款，或要求预付款保障。']); if(x.qualification==='合格'&&Number(r.交付上限工作日)-Number(x.交付工作日)<=3)risks.push(['','交付缓冲仅 '+(Number(r.交付上限工作日)-Number(x.交付工作日))+' 个工作日','延期会直接影响上线；建议写入逾期责任和安装验收节点。']); if(risks.length){h+=`<div class="risk ${risks[0][0]}"><b>${x.供应商}</b>${risks.map(z=>`<div>风险等级：${z[0]==='high'?'高':z[0]?'低':'中'}｜事实：${z[1]}<br>建议动作：${z[2]}</div>`).join('')}</div>`}});
  h+=`</div><div class="section"><h2>五、推荐方案与理由</h2>`;
  if(rec){h+=`<div class="callout"><b>推荐方案：${rec.供应商}</b><br>推荐评分：${rec.scores.total.toFixed(2)} / 100<br><ul><li>满足全部硬性要求：${rec.分辨率} dpi、有线网络、${rec.交付工作日} 个工作日完成交付安装、${rec.保修年} 年整机保修。</li><li>含税总成本为 ${money(rec.total)}；最低合格报价为 ${lowest.供应商} 的 ${money(lowest.total)}。</li><li>付款条件为“${rec.付款方式}”，相较部分预付方案履约风险更低。</li></ul><b>主要让步/代价：</b>${rec===lowest?'无价格让步。':'比最低合格报价高 '+money(rec.total-lowest.total)+'。'}<br><b>合同前置条件：</b>将全量安装调试、培训、交付日期、保修年限和验收标准写入合同；${rec.付款类型==='验收后付款'?'保持验收后付款。':'争取改为验收后付款或增加预付款保障。'}<br><b>备选方案：</b>${lowest&&lowest!==rec?lowest.供应商+'，前提是解决付款/履约风险。':'无。'}</div>`} else h+='<div class="risk high">没有可推荐供应商，请先补充或修正报价。</div>';
  h+=`</div><div class="section"><h2>六、待确认事项</h2>`;
  const confirm=[]; rows.forEach(x=>{const missing=[]; if(x.checks.数量==='待确认')missing.push('适用数量（Excel 单元格为空或无法识别）'); if(x.checks.分辨率==='待确认')missing.push('分辨率（Excel 单元格为空或无法识别，无法判断是否满足 '+(r.分辨率下限??'采购要求')+' dpi）'); if(x.checks.有线网络==='待确认')missing.push('网络（Excel 单元格为空或采购需求未明确）'); if(x.checks.交付并安装==='待确认'){if(!hasValue(x.交付工作日))missing.push('交付周期（Excel 单元格为空或无法识别）'); if(x.交付含安装===undefined)missing.push('交付是否包含安装（Excel 中未明确“完成安装”）')} if(x.checks.整机保修==='待确认')missing.push('整机保修（Excel 单元格为空或无法识别）'); if(x.checks.安装调试==='待确认')missing.push('安装调试费用或范围（Excel 单元格为空）'); if(x.checks.培训==='待确认')missing.push('培训场次（Excel 单元格为空或无法识别）'); if(!hasValue(x.设备单价))missing.push('设备单价（未计入总成本）'); if(!hasValue(x.运费))missing.push('运费（未计入总成本）'); if(!hasValue(x.安装调试))missing.push('安装调试费用（未计入总成本）'); if(!hasValue(x.强制服务费))missing.push('强制服务费（未计入总成本）'); if(!hasValue(x.培训费用))missing.push('培训费用（报价未说明是否免费，未计入总成本）'); [...new Set(missing)].forEach(m=>confirm.push(x.供应商+'：'+m))}); h+=confirm.length?'<ul>'+confirm.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'<div class="muted">无。所有关键字段均已提供。</div>'; h+='</div>';
  $('result').innerHTML=h;
}
let convoStep=1, requirementData=null;
function addMsg(who,text,extra){const el=document.createElement('div');el.className='msg '+who;el.innerHTML=text+(extra?'<div class="schema">'+extra+'</div>':'');$('chat').appendChild(el);$('chat').scrollTop=$('chat').scrollHeight}
function startConversation(){convoStep=1;requirementData=null;$('chat').innerHTML='';$('uploadArea').style.display='none';$('xlsxFile').value='';$('status').textContent='';$('fileStatus').textContent='';addMsg('agent','你好，我是采购报价分析助手。<br><b>请输入你的采购需求</b>，包含数量、规格、交付、保修、安装、培训和付款偏好等。');$('stepHelp').innerHTML='';$('input').placeholder='请输入你的采购需求…如：采购 40 台仓库工业标签打印机，打印分辨率≥300 dpi…'}
function finishVendors(vendors,label){const data={需求:requirementData,供应商:vendors};addMsg('user',label);const a=analyze(data);render(a,data);addMsg('agent','已收到 '+vendors.length+' 家供应商报价，已完成标准化、硬性规则校验和风险推荐。结果已显示在右侧。');convoStep=3;$('stepHelp').innerHTML='分析完成。点击“重新开始”可以进行下一轮采购比价。';$('input').placeholder='如需分析另一批报价，请点击“重新开始”。';$('input').value='';$('uploadArea').style.display='none';$('status').textContent='分析完成：供应商信息已从 Excel/表格读取并进入固定规则分析。';$('status').style.color='#087443'}
async function readUploaded(){const file=$('xlsxFile').files[0];if(!file){$('fileStatus').textContent='请先选择 .xlsx 文件。';return}try{$('fileStatus').textContent='正在读取 '+file.name+'…';const vendors=await parseXlsx(file,requirementData.数量||40);finishVendors(vendors,'已上传供应商文件：'+file.name);$('fileStatus').textContent='读取成功：'+vendors.length+' 家供应商。'}catch(e){$('fileStatus').textContent='Excel 读取失败：'+e.message}}
function sendMessage(){const text=$('input').value.trim();if(!text&&convoStep!==2){$('status').textContent='请先输入内容。';return}if(convoStep===1){try{requirementData=text.startsWith('{')?JSON.parse(text).需求:parseRequirement(text);addMsg('user',text);addMsg('agent','已收到采购需求。请继续提供可选择的供应商信息（<b>可以直接上传 Excel</b>）。','供应商 | 适用数量 | 分辨率 | 网络 | 设备单价 | 运费 | 安装调试 | 强制服务费 | 培训 | 交付（合同生效后） | 整机保修 | 付款方式\n--- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | ---');convoStep=2;$('uploadArea').style.display='block';$('stepHelp').innerHTML='';$('input').placeholder='';$('input').value='';$('status').textContent=''}catch(e){$('status').textContent='采购需求识别失败：'+e.message}}else{if(!text&&$('xlsxFile').files[0])return readUploaded();try{const vendors=parseSuppliers(text,requirementData.数量||40);finishVendors(vendors,text)}catch(e){$('status').textContent='供应商信息识别失败：'+e.message}}}
